<!doctype html><meta charset="utf-8"><title>bake</title>
<script type="module">
// Loads a museum GLB (meshopt), simplifies it by vertex clustering (position + uv cells, so texture seams survive),
// and returns it in the GKM1 format used by Gusinjska kocka, plus its textures at 512 px.
import * as THREE from '../vendor/three/three.module.min.js';
import { GLTFLoader } from '../vendor/three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from '../vendor/three/addons/libs/meshopt_decoder.module.js';
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
function img2jpg(image, size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(image, 0, 0, size, size);
  return c.toDataURL('image/jpeg', 0.86).split(',')[1];
}
function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
window.bake = async (url, G, UVQ, texSize) => {
  const gltf = await loader.loadAsync(url);
  gltf.scene.updateMatrixWorld(true);
  let mesh = null; gltf.scene.traverse((o) => { if (o.isMesh && !mesh) mesh = o; });
  const g = mesh.geometry, P = g.attributes.position, N = g.attributes.normal, T = g.attributes.uv, I = g.index;
  const n = P.count, v = new THREE.Vector3(), nm = new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
  let uvMin = [9, 9], uvMax = [-9, -9];
  for (let i = 0; i < n; i++) {
    v.fromBufferAttribute(P, i).applyMatrix4(mesh.matrixWorld); pos.set([v.x, v.y, v.z], i * 3);
    v.fromBufferAttribute(N, i).applyMatrix3(nm).normalize(); nor.set([v.x, v.y, v.z], i * 3);
    const a = T.getX(i), b = T.getY(i); uv[i * 2] = a; uv[i * 2 + 1] = b;
    uvMin = [Math.min(uvMin[0], a), Math.min(uvMin[1], b)]; uvMax = [Math.max(uvMax[0], a), Math.max(uvMax[1], b)];
  }
  const box = new THREE.Box3().setFromArray(pos), size = box.getSize(new THREE.Vector3());
  // base at y = 0, centred on x/z
  const c = box.getCenter(new THREE.Vector3());
  for (let i = 0; i < n; i++) { pos[i * 3] -= c.x; pos[i * 3 + 1] -= box.min.y; pos[i * 3 + 2] -= c.z; }
  const cell = Math.max(size.x, size.y, size.z) / G;
  const map = new Map(), sums = [], remap = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const k = `${Math.floor(pos[i * 3] / cell)},${Math.floor(pos[i * 3 + 1] / cell)},${Math.floor(pos[i * 3 + 2] / cell)},${Math.round(uv[i * 2] * UVQ)},${Math.round(uv[i * 2 + 1] * UVQ)}`;
    let id = map.get(k);
    if (id === undefined) { id = sums.length; map.set(k, id); sums.push([0, 0, 0, 0, 0, 0, 0, 0, 0]); }
    const s = sums[id];
    s[0] += pos[i * 3]; s[1] += pos[i * 3 + 1]; s[2] += pos[i * 3 + 2]; s[3] += nor[i * 3]; s[4] += nor[i * 3 + 1]; s[5] += nor[i * 3 + 2];
    s[6] += uv[i * 2]; s[7] += uv[i * 2 + 1]; s[8]++;
    remap[i] = id;
  }
  const tris = [], seen = new Set();
  for (let t = 0; t < I.count; t += 3) {
    const a = remap[I.getX(t)], b = remap[I.getX(t + 1)], cc = remap[I.getX(t + 2)];
    if (a === b || b === cc || a === cc) continue;
    const key = [a, b, cc].sort((x, y) => x - y).join(',');
    if (seen.has(key)) continue; seen.add(key); tris.push(a, b, cc);
  }
  const nv = sums.length, nf = tris.length / 3;
  const P2 = new Float32Array(nv * 3), N2 = new Float32Array(nv * 3), U2 = new Float32Array(nv * 2);
  sums.forEach((s, i) => {
    P2.set([s[0] / s[8], s[1] / s[8], s[2] / s[8]], i * 3);
    const l = Math.hypot(s[3], s[4], s[5]) || 1; N2.set([s[3] / l, s[4] / l, s[5] / l], i * 3);
    U2.set([s[6] / s[8], s[7] / s[8]], i * 2);
  });
  const b2 = new THREE.Box3().setFromArray(P2), lo = b2.min.toArray(), hi = b2.max.toArray();
  const idx32 = nv > 65535;
  let head = JSON.stringify({ nv, nf, min: lo.map((x) => +x.toFixed(6)), max: hi.map((x) => +x.toFixed(6)), idx32 });
  while ((8 + head.length) % 4) head += ' ';
  const pad4 = (b) => Math.ceil(b / 4) * 4;
  const total = 8 + head.length + pad4(nv * 6) + pad4(nv * 4) + pad4(nv * 4) + pad4(nf * 3 * (idx32 ? 4 : 2));
  const buf = new ArrayBuffer(total), dv = new DataView(buf), u8 = new Uint8Array(buf);
  'GKM1'.split('').forEach((ch, i) => dv.setUint8(i, ch.charCodeAt(0)));
  dv.setUint32(4, head.length, true);
  u8.set(new TextEncoder().encode(head), 8);
  let off = 8 + head.length;
  const span = hi.map((x, i) => x - lo[i] || 1);
  const qp = new Uint16Array(buf, off, nv * 3); off += pad4(nv * 6);
  const qu = new Uint16Array(buf, off, nv * 2); off += pad4(nv * 4);
  const qn = new Int8Array(buf, off, nv * 4); off += pad4(nv * 4);
  const qi = idx32 ? new Uint32Array(buf, off, nf * 3) : new Uint16Array(buf, off, nf * 3);
  for (let i = 0; i < nv; i++) {
    for (let k = 0; k < 3; k++) { qp[i * 3 + k] = Math.round((P2[i * 3 + k] - lo[k]) / span[k] * 65535); qn[i * 4 + k] = Math.round(N2[i * 3 + k] * 127); }
    qu[i * 2] = Math.round(Math.min(1, Math.max(0, U2[i * 2])) * 65535); qu[i * 2 + 1] = Math.round(Math.min(1, Math.max(0, U2[i * 2 + 1])) * 65535);
  }
  qi.set(tris);
  const m = mesh.material;
  return {
    bin: b64(u8), map: m.map ? img2jpg(m.map.image, texSize) : null, normal: m.normalMap ? img2jpg(m.normalMap.image, texSize) : null,
    stats: { inVerts: n, inTris: I.count / 3, nv, nf, size: size.toArray(), uvMin, uvMax, bytes: total, metal: m.metalness, rough: m.roughness },
  };
};
window.ready = true;
</script>
